<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Reservation & Scheduling Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=v26">
  <link rel="stylesheet" href="/static/auth.css?v=v11">
</head>
<body class="auth-body">
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>

  <div class="auth-card">
    <h1>Forgot password</h1>
    <p class="auth-subtitle">We'll email you a link to reset it.</p>

    <form id="forgot-password-form" class="auth-form">
      <div class="auth-field">
        <label for="forgot-password-email">Email</label>
        <input type="email" id="forgot-password-email" required autocomplete="email">
      </div>
      <button type="submit" class="auth-submit">Send reset link</button>
      <p id="forgot-password-message" class="auth-message" aria-live="polite"></p>
    </form>

    <p class="auth-footer"><a href="/login.html">Back to log in</a></p>
  </div>

  <script src="/static/theme.js?v=redesign-8"></script>
  <script src="/static/auth.js?v=redesign-10"></script>
</body>
</html>
