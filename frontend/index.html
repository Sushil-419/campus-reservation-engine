<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Reservation Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Centered Login/Register Card Container -->
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="container-sm" style="width: 100%; margin: 0; padding: 0;">
      <div class="text-center mb-2">
        <h1 style="font-size: 1.6rem; font-weight: 700; color: var(--primary); margin-bottom: 0.25rem;">Resource Reservation & Scheduling Engine</h1>
        <p class="text-muted text-sm"><strong>KLE Tech — Team 16</strong> | Multi-User Campus Resource Scheduling</p>
      </div>

      <div class="card">
        <!-- Tabs for Switching Between Login and Register -->
        <div class="tabs">
          <button type="button" class="tab active" id="tab-login">Login</button>
          <button type="button" class="tab" id="tab-register">Register</button>
        </div>

        <!-- Login Form -->
        <form id="form-login">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="name@kletech.ac.in">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Enter your password">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="btn-login">Login</button>
        </form>

        <!-- Register Form -->
        <form id="form-register" class="hidden">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" name="name" required autocomplete="name" placeholder="John Doe">
          </div>
          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" name="email" required autocomplete="email" placeholder="name@kletech.ac.in">
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" required autocomplete="new-password" placeholder="Choose a secure password">
          </div>
          <div class="form-group">
            <label for="reg-role">Role</label>
            <select id="reg-role" name="role" required>
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
              <option value="lab_instructor">Lab Instructor</option>
              <option value="hod">Head of Department (HOD)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="reg-department">Department (Optional)</label>
            <input type="text" id="reg-department" name="department" placeholder="e.g. Computer Science & Engineering">
          </div>
          <div class="form-group">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text);">
              <input type="checkbox" id="reg-is-cr" name="is_cr" style="width: auto; margin: 0; cursor: pointer;">
              <span>Class Representative (CR)</span>
            </label>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="btn-register">Register</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Toast notification helper function
    function showToast(message, type = 'info', duration = 3500) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;

      container.appendChild(toast);

      setTimeout(() => {
        toast.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => {
          if (toast.parentNode) {
            toast.remove();
          }
        }, 300);
      }, duration);
    }

    // Tab toggle functionality
    function switchTab(targetTab) {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      if (targetTab === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      } else if (targetTab === 'register') {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
      }
    }

    document.getElementById('tab-login').addEventListener('click', () => switchTab('login'));
    document.getElementById('tab-register').addEventListener('click', () => switchTab('register'));

    // Handle Login submission
    const formLogin = document.getElementById('form-login');
    const btnLogin = document.getElementById('btn-login');

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      btnLogin.disabled = true;
      btnLogin.textContent = 'Logging in...';

      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json().catch(() => null);

        if (response.ok) {
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'resources.html';
          }, 500);
        } else {
          let errorMsg = 'Login failed';
          if (data && data.detail) {
            if (Array.isArray(data.detail)) {
              errorMsg = data.detail.map(d => d.msg || d.message).join(', ');
            } else {
              errorMsg = data.detail;
            }
          }
          showToast(errorMsg, 'error');
        }
      } catch (err) {
        showToast(err.message || 'Network error. Please try again.', 'error');
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Login';
      }
    });

    // Handle Register submission
    const formRegister = document.getElementById('form-register');
    const btnRegister = document.getElementById('btn-register');

    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const role = document.getElementById('reg-role').value;
      const departmentRaw = document.getElementById('reg-department').value.trim();
      const department = departmentRaw.length > 0 ? departmentRaw : null;
      const is_cr = document.getElementById('reg-is-cr').checked;

      btnRegister.disabled = true;
      btnRegister.textContent = 'Registering...';

      try {
        const response = await fetch('/auth/register', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name,
            email,
            password,
            role,
            department,
            is_cr
          })
        });

        const data = await response.json().catch(() => null);

        if (response.ok) {
          showToast('Registered! Please login', 'success');
          formRegister.reset();
          document.getElementById('login-email').value = email;
          document.getElementById('login-password').value = '';
          switchTab('login');
          document.getElementById('login-password').focus();
        } else {
          let errorMsg = 'Registration failed';
          if (data && data.detail) {
            if (Array.isArray(data.detail)) {
              errorMsg = data.detail.map(d => d.msg || d.message).join(', ');
            } else {
              errorMsg = data.detail;
            }
          }
          showToast(errorMsg, 'error');
        }
      } catch (err) {
        showToast(err.message || 'Network error. Please try again.', 'error');
      } finally {
        btnRegister.disabled = false;
        btnRegister.textContent = 'Register';
      }
    });
  </script>
</body>
</html>
