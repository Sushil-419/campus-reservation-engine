services:
  - type: web
    name: campus-reservation-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "alembic upgrade head && python -m scripts.seed_all && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: campus-db
    databaseName: booking
    user: postgres
    plan: free
