<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit History &mdash; Campus Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-content">
      <header class="topbar">
        <div class="flex items-center gap-2">
          <button id="sidebar-toggle" class="btn btn-ghost btn-sm">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <span class="topbar-title">Immutable Audit Trail</span>
        </div>
        <div class="topbar-actions">
          <a href="bookings.html" class="btn btn-ghost btn-sm">&larr; Return to Bookings</a>
        </div>
      </header>

      <main class="page-body">
        <div class="card mb-3">
          <div class="card-header">
            <h2 class="card-title" id="history-title">Transaction Records for Slot</h2>
          </div>
          <div class="card-body">
            <div id="history-list">
              <div class="text-center text-muted" style="padding: 2rem;">Loading ledger entries...</div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let user = null;

    async function init() {
      user = await getCurrentUser();
      if (!user) return;
      initSidebar(user, 'bookings');

      const urlParams = new URLSearchParams(window.location.search);
      const bookingId = urlParams.get('booking_id');
      if (!bookingId) {
        showToast('No booking identifier supplied', 'error');
        setTimeout(() => { window.location.href = 'bookings.html'; }, 1500);
        return;
      }

      document.getElementById('history-title').textContent = `Audit Trail for Reservation #${bookingId}`;
      const container = document.getElementById('history-list');

      try {
        const entries = await api(`/bookings/${bookingId}/history`);
        if (!entries || entries.length === 0) {
          container.innerHTML = '<div class="text-center text-muted" style="padding: 2rem;">No audit records found for this slot.</div>';
          return;
        }

        container.innerHTML = entries.map(e => `
          <div style="border-left: 3px solid var(--primary); padding-left: 1rem; margin-bottom: 1.25rem;">
            <div class="flex justify-between items-center">
              <strong style="text-transform: uppercase; font-size: 0.9rem;">${e.action} (${e.outcome})</strong>
              <span class="text-xs text-muted">${fmtDateTime(e.at)}</span>
            </div>
            <div class="text-xs text-muted mt-1">Actor ID: ${e.actor_id ?? 'System'}</div>
            ${e.detail ? `<pre style="background: var(--bg); padding: 0.5rem; border-radius: 4px; font-size: 0.78rem; margin-top: 0.4rem;">${JSON.stringify(e.detail, null, 2)}</pre>` : ''}
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="text-danger">${err.message}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
