<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Facilities &amp; Resources &mdash; Reservation Engine</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .facility-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .facility-card:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow);
    }
    .facility-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .facility-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .facility-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.4;
    }
    .facility-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }
    .tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
    }
    .facility-actions {
      display: flex;
      gap: 0.5rem;
      border-top: 1px solid var(--border-light);
      padding-top: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div class="app-shell">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Content Container -->
    <div class="main-content">
      <header class="topbar">
        <div class="flex items-center gap-2">
          <button id="sidebar-toggle" class="btn btn-ghost btn-sm" aria-label="Toggle navigation">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <span class="topbar-title">Facilities &amp; Room Registry</span>
        </div>
        <div class="topbar-actions">
          <span id="role-display-badge"></span>
        </div>
      </header>

      <main class="page-body">
        <!-- Banner Message -->
        <div id="role-banner" class="alert alert-info hidden"></div>

        <!-- Filter Toolbar -->
        <div class="filter-bar">
          <div class="form-group" style="flex: 2; min-width: 220px;">
            <label class="form-label">Search Query</label>
            <input type="text" id="filter-q" class="form-control" placeholder="Search room name or code...">
          </div>
          <div class="form-group">
            <label class="form-label">Building</label>
            <select id="filter-building" class="form-control">
              <option value="">All Complexes</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Facility Type</label>
            <select id="filter-type" class="form-control">
              <option value="">All Categories</option>
              <option value="classroom">Classroom</option>
              <option value="lab">Laboratory</option>
              <option value="project_space">Project Studio</option>
              <option value="seminar_hall">Seminar Hall</option>
              <option value="auditorium">Auditorium</option>
              <option value="sports">Sports Arena</option>
              <option value="club_room">Club Room</option>
            </select>
          </div>
          <button class="btn btn-primary" id="btn-filter" style="height: 38px;">Apply Filters</button>
        </div>

        <!-- Facilities Grid -->
        <div id="facilities-grid" class="grid grid-2 mb-3">
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="spinner"></div>
            <div class="empty-title mt-2">Loading facility registry...</div>
          </div>
        </div>

        <!-- Pagination -->
        <div class="card pagination" id="pagination-bar" style="display: none;">
          <span class="pagination-info" id="pagination-info">Showing records</span>
          <div class="pagination-controls">
            <button class="page-btn" id="btn-prev" disabled>&larr; Previous</button>
            <button class="page-btn" id="btn-next" disabled>Next &rarr;</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Booking / Request Modal -->
  <div id="action-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Facility Reservation</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="form-action">
        <div class="modal-body">
          <div id="modal-resource-summary" class="alert alert-info mb-2"></div>

          <input type="hidden" id="modal-resource-id">

          <div class="form-group">
            <label class="form-label" for="book-date">Reservation Date</label>
            <input type="date" id="book-date" class="form-control" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="book-start">Start Time (30-min interval)</label>
              <input type="time" id="book-start" class="form-control" step="1800" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="book-end">End Time (30-min interval)</label>
              <input type="time" id="book-end" class="form-control" step="1800" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="book-purpose">Academic Purpose / Justification</label>
            <textarea id="book-purpose" class="form-control" rows="3" required placeholder="Specify academic purpose, course, or event details (minimum 10 characters)..."></textarea>
          </div>

          <div id="faculty-ref-group" class="form-group hidden">
            <label class="form-label" for="book-faculty-ref">Faculty Guide / Coordinator Email</label>
            <input type="email" id="book-faculty-ref" class="form-control" placeholder="faculty@kletech.ac.in">
            <div class="form-hint">Required for student project rooms and guided research labs.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Dismiss</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-action">Confirm Reservation</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let user = null;
    let page = 1;
    const pageSize = 12;
    let selectedResource = null;
    let isRequestFlow = false;

    async function init() {
      user = await getCurrentUser();
      if (!user) return;

      initSidebar(user, 'resources');

      document.getElementById('role-display-badge').innerHTML = roleBadge(user.role);

      const banner = document.getElementById('role-banner');
      if (user.role === 'cr') {
        banner.textContent = `Authenticated as Class Representative (${user.branch || user.department} Div ${user.division || 'All'}). Reservations for classrooms & labs will be queued for Head of Department approval.`;
        banner.classList.remove('hidden');
      } else if (user.role === 'club_president') {
        banner.textContent = 'Authenticated as Student Club President. Facility bookings will be routed to the respective HOD or Central Administration queue.';
        banner.classList.remove('hidden');
      } else if (user.role === 'student') {
        banner.textContent = 'Student access active. Read-only schedule inspection permitted. Contact your CR or Club President for room reservations.';
        banner.classList.remove('hidden');
      }

      await loadBuildings();
      await fetchResources(1);

      const today = new Date().toISOString().split('T')[0];
      document.getElementById('book-date').min = today;
      document.getElementById('book-date').value = today;
    }

    async function loadBuildings() {
      try {
        const buildings = await api('/resources/buildings');
        const select = document.getElementById('filter-building');
        buildings.forEach(b => {
          const opt = document.createElement('option');
          opt.value = b;
          opt.textContent = b;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchResources(targetPage = 1) {
      page = targetPage;
      const grid = document.getElementById('facilities-grid');
      grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><div class="spinner"></div><div class="empty-title mt-2">Loading facility registry...</div></div>';

      const q = document.getElementById('filter-q').value.trim();
      const building = document.getElementById('filter-building').value;
      const type = document.getElementById('filter-type').value;

      const params = new URLSearchParams({ page: page, page_size: pageSize });
      if (q) params.set('q', q);
      if (building) params.set('building', building);
      if (type) params.set('type', type);

      try {
        const data = await api(`/resources/?${params.toString()}`);
        if (!data || !data.items || data.items.length === 0) {
          grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-title">No resources match your filters</div><div class="empty-desc">Try modifying search parameters or category constraints.</div></div>';
          document.getElementById('pagination-bar').style.display = 'none';
          return;
        }

        grid.innerHTML = '';
        data.items.forEach(res => {
          const card = document.createElement('div');
          card.className = 'facility-card';

          const btnConfig = getActionBtnConfig(user, res);
          let actionBtnHtml = '';
          if (btnConfig) {
            if (btnConfig.disabled) {
              actionBtnHtml = `<button class="btn btn-ghost btn-sm flex-1" disabled style="opacity: 0.6; font-size: 0.75rem;">${btnConfig.label}</button>`;
            } else {
              actionBtnHtml = `<button class="btn btn-primary btn-sm flex-1" onclick="openActionModal(${res.id}, '${res.name}', '${res.building}', '${res.type}', '${res.department || ''}', ${btnConfig.isRequest})">${btnConfig.label}</button>`;
            }
          }

          card.innerHTML = `
            <div>
              <div class="facility-header">
                <div>
                  <div class="facility-title">${res.name}</div>
                  <div class="text-xs text-muted">${res.building} &bull; Floor ${res.floor}</div>
                </div>
                ${typeBadge(res.type)}
              </div>
              <div class="facility-meta">
                ${res.department ? `Department: <strong>${res.department}</strong>` : 'Campus-wide Resource (Shared)'}
                ${res.capacity ? `<br>Capacity: <strong>${res.capacity} occupants</strong>` : ''}
              </div>
              <div class="facility-tags">
                <span class="tag">${res.department ? res.department : 'General'}</span>
                <span class="tag">Floor ${res.floor}</span>
                ${res.capacity ? `<span class="tag">${res.capacity} Seats</span>` : ''}
              </div>
            </div>
            <div class="facility-actions">
              <a href="availability.html?resource_id=${res.id}" class="btn btn-ghost btn-sm flex-1">View Schedule</a>
              ${actionBtnHtml}
            </div>
          `;
          grid.appendChild(card);
        });

        const totalPages = Math.ceil(data.total / pageSize);
        document.getElementById('pagination-bar').style.display = 'flex';
        document.getElementById('pagination-info').textContent = `Showing Page ${data.page} of ${totalPages} (${data.total} total facilities)`;
        document.getElementById('btn-prev').disabled = data.page <= 1;
        document.getElementById('btn-next').disabled = data.page >= totalPages;
      } catch (err) {
        grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><div class="text-danger">${err.message}</div></div>`;
      }
    }

    function getActionBtnConfig(u, r) {
      if (u.role === 'student') return null;

      // CR Rules: Only classrooms and labs in own branch
      if (u.role === 'cr') {
        const isClassOrLab = ['classroom', 'lab'].includes(r.type);
        const isOwnBranch = !r.department || (u.branch && r.department === u.branch);
        if (!isClassOrLab) {
          return { label: 'CR: Classrooms & Labs Only', disabled: true };
        }
        if (!isOwnBranch) {
          return { label: `CR: ${u.branch} Rooms Only`, disabled: true };
        }
        return { label: 'Request to Branch HOD', isRequest: true };
      }

      // Super Admin: Direct booking anywhere
      if (u.role === 'super_admin') {
        return { label: 'Direct Reserve', isRequest: false };
      }

      // Campus Central (Auditorium, Sports, Club Room)
      const isCampus = ['auditorium', 'sports', 'club_room'].includes(r.type);
      if (isCampus) {
        if (u.role === 'club_president') {
          return { label: 'Request Venue (Super Admin)', isRequest: true };
        }
        return { label: 'Request Central Venue', isRequest: true };
      }

      // Department HOD
      if (u.role === 'hod') {
        if (r.department && r.department === u.department) {
          return { label: 'Direct Reserve', isRequest: false };
        }
        return { label: 'Request from Host HOD', isRequest: true };
      }

      // Faculty & Lab Instructors
      if (['faculty', 'lab_instructor'].includes(u.role)) {
        if (r.department && r.department === u.department) {
          return { label: 'Direct Reserve', isRequest: false };
        }
        return { label: 'Request from Host HOD', isRequest: true };
      }

      // Club President
      if (u.role === 'club_president') {
        return { label: 'Request to Dept HOD', isRequest: true };
      }

      // Default Admin
      return { label: 'Direct Reserve', isRequest: false };
    }

    function openActionModal(id, name, building, type, dept, requestMode) {
      selectedResource = { id, name, building, type, department: dept };
      isRequestFlow = requestMode;

      document.getElementById('modal-resource-id').value = id;
      document.getElementById('modal-title').textContent = requestMode
        ? `Submit Reservation Request: ${name}`
        : `Direct Facility Booking: ${name}`;

      const summary = document.getElementById('modal-resource-summary');
      summary.innerHTML = `
        <strong>${name}</strong> (${building}, Floor ${selectedResource.department || 'Campus'})<br>
        <span class="text-xs">Category: ${type.toUpperCase()} &bull; Workflow: <strong>${requestMode ? 'Requires Approval' : 'Instant Confirmation'}</strong></span>
      `;

      const submitBtn = document.getElementById('btn-submit-action');
      submitBtn.textContent = requestMode ? 'Submit for Review' : 'Confirm Allocation';

      const refGroup = document.getElementById('faculty-ref-group');
      if (['project_space', 'research_center'].includes(type) && !['super_admin', 'admin', 'hod'].includes(user.role)) {
        refGroup.classList.remove('hidden');
      } else {
        refGroup.classList.add('hidden');
      }

      document.getElementById('action-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('action-modal').classList.add('hidden');
      document.getElementById('form-action').reset();
    }

    document.getElementById('btn-filter').addEventListener('click', () => fetchResources(1));
    document.getElementById('filter-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') fetchResources(1); });
    document.getElementById('btn-prev').addEventListener('click', () => { if (page > 1) fetchResources(page - 1); });
    document.getElementById('btn-next').addEventListener('click', () => fetchResources(page + 1));

    document.getElementById('form-action').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-action');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Processing...';

      const payload = {
        resource_id: parseInt(document.getElementById('modal-resource-id').value),
        date: document.getElementById('book-date').value,
        start: document.getElementById('book-start').value,
        end: document.getElementById('book-end').value,
        purpose: document.getElementById('book-purpose').value.trim()
      };

      const refInput = document.getElementById('book-faculty-ref');
      if (!refInput.parentElement.classList.contains('hidden') && refInput.value.trim()) {
        payload.faculty_ref_email = refInput.value.trim();
      }

      const endpoint = isRequestFlow ? '/requests/' : '/bookings/';

      try {
        await api(endpoint, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        showToast(
          isRequestFlow
            ? 'Reservation request submitted. Awaiting administrative review.'
            : 'Facility booked successfully.',
          'success'
        );
        closeModal();
      } catch (err) {
        showToast(err.message || 'Operation failed', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = isRequestFlow ? 'Submit for Review' : 'Confirm Allocation';
      }
    });

    init();
  </script>
</body>
</html>
