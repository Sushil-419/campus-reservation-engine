# Production stack for a single server: PostgreSQL + app + Caddy (HTTPS).
# ${POSTGRES_PASSWORD} and ${DOMAIN} are interpolated by Compose from the shell
# or from --env-file, so start it with:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Only Caddy publishes ports; db and app are reachable on the compose network only.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: resvdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resvdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set it}@db:5432/resvdb
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8050
      --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set it}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
